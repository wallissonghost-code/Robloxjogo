<title>Mundial War</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: the map is the whole screen; compact HUD panels sit on the edges like the Roblox client. */
:root {
  --ocean: #2e5c8a;
  --panel: rgba(16, 22, 30, 0.88);
  --panel-solid: #10161e;
  --chip: #222c3a;
  --chip-hover: #2e3b4e;
  --ink: #eceef0;
  --muted: #96a0ac;
  --gold: #f0c45c;
  --good: #6ec882;
  --bad: #eb6e64;
  --war: #ff8c6e;
  --ui: "Montserrat", "Gotham", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ocean); color: var(--ink); font-family: var(--ui); overflow: hidden; user-select: none; -webkit-user-select: none; }
#map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.panel { background: var(--panel); border-radius: 8px; backdrop-filter: blur(4px); }
button { font: 700 13px var(--ui); color: var(--ink); background: var(--chip); border: 0; border-radius: 6px; cursor: pointer; }
button:hover { background: var(--chip-hover); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.num { font-variant-numeric: tabular-nums; }

#card { position: fixed; left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: 300px; display: flex; gap: 10px; align-items: center; padding: 8px 10px 8px 8px; }
#avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 18px; border: 2px solid var(--ink); flex: none; background: #3c4654; }
#card .lines { min-width: 0; display: grid; gap: 2px; font-size: 13px; }
#card b { font-weight: 700; }
#card .dim { color: var(--muted); font-weight: 500; }
#pname { font-weight: 700; font-size: 14px; }

#percent { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 4px; padding: 5px 6px; }
#percent button { width: 48px; height: 30px; }
#percent button.on { background: var(--gold); color: #1e180a; }
#cancel { background: #6e2e2c !important; width: 40px !important; }

#tools { position: fixed; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 4px; padding: 5px; }
#tools button { width: 34px; height: 30px; font-size: 15px; }
#tools button.active { background: #5c4a1e; }
#tools button.danger.active { background: #78302c; }

#tray, #wtray { position: fixed; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(60px + env(safe-area-inset-bottom, 0px)); width: 304px; padding: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
#tray button, #wtray button { text-align: left; padding: 6px 8px; display: grid; gap: 2px; font-size: 12px; line-height: 1.2; }
#tray button .cost, #wtray button .cost { font-size: 11px; color: var(--gold); font-weight: 600; }
#tray button.poor, #wtray button.poor { opacity: 0.55; }
#tray button.poor .cost, #wtray button.poor .cost { color: var(--muted); }
#tray button.sel { background: #5c4a1e; }
#wtray button.sel { background: #78302c; }
.trayInfo { grid-column: 1 / -1; font-size: 12px; color: var(--muted); font-weight: 500; padding: 2px 2px 0; line-height: 1.4; }
.trayInfo b { color: var(--ink); }

#banner { position: fixed; left: 50%; transform: translateX(-50%); top: calc(10px + env(safe-area-inset-top, 0px)); padding: 7px 14px; font-weight: 700; font-size: 14px; color: var(--gold); white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
#toasts { position: fixed; left: 50%; transform: translateX(-50%); top: calc(48px + env(safe-area-inset-top, 0px)); display: grid; gap: 4px; justify-items: center; pointer-events: none; width: min(520px, calc(100vw - 32px)); }
.toast { background: var(--panel-solid); border-radius: 6px; padding: 5px 10px; font-size: 13px; font-weight: 600; transition: opacity 0.4s; }
.toast.good { color: var(--good); } .toast.bad { color: var(--bad); } .toast.war { color: var(--war); }

#ranking { position: fixed; right: calc(12px + env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); width: 220px; padding: 7px 9px; display: grid; gap: 2px; font-size: 12px; }
#ranking .row { display: flex; gap: 6px; align-items: baseline; white-space: nowrap; overflow: hidden; }
#ranking .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; align-self: center; }
#ranking .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; font-weight: 600; }
#ranking .nm.me { color: var(--gold); }
#ranking .v { color: var(--muted); font-weight: 500; }

#requests { position: fixed; right: calc(244px + env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); width: 250px; display: grid; gap: 6px; }
.req { padding: 8px 10px; display: grid; gap: 6px; font-size: 13px; font-weight: 700; }
.req .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.req button { height: 26px; font-size: 12px; }
.req .yes { background: #2e6e40; }

#popover { position: fixed; width: 230px; padding: 9px 11px; display: grid; gap: 6px; z-index: 5; }
#popTitle { font-weight: 700; font-size: 14px; }
#popBody { font-size: 12px; color: var(--muted); font-weight: 500; line-height: 1.4; white-space: pre-line; }
#popBtns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
#popBtns button { height: 28px; font-size: 12px; }
#popBtns button.danger { background: #78302c; }

#center { position: fixed; left: 50%; top: 44%; transform: translate(-50%, -50%); width: min(460px, calc(100vw - 32px)); padding: 18px 20px; display: grid; gap: 10px; justify-items: center; text-align: center; z-index: 6; }
#centerTitle { font-weight: 800; font-size: 26px; color: var(--gold); letter-spacing: 0.02em; }
#centerBody { font-size: 14px; line-height: 1.5; font-weight: 500; text-align: left; }
#centerBody p { margin: 0 0 6px; }
#centerBody b { color: var(--gold); }
#centerClose { height: 32px; padding: 0 22px; }

#menu { position: fixed; left: 50%; top: 47%; transform: translate(-50%, -50%); width: min(620px, calc(100vw - 32px)); padding: 18px; display: grid; gap: 12px; z-index: 7; }
#menu h1 { margin: 0; text-align: center; font-weight: 800; font-size: 28px; letter-spacing: 0.05em; color: var(--gold); }
#menu .sub { text-align: center; color: var(--muted); font-size: 13px; font-weight: 500; }
#modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.mode { background: #1c2634; border-radius: 8px; padding: 12px; display: grid; gap: 8px; align-content: start; border: 2px solid transparent; }
.mode.voted { border-color: var(--gold); }
.mode h2 { margin: 0; font-size: 17px; font-weight: 700; }
.mode p { margin: 0; font-size: 12px; line-height: 1.45; color: var(--muted); font-weight: 500; }
.mode .votes { font-size: 12px; color: var(--gold); font-weight: 600; }
.mode button { height: 32px; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ocean); z-index: 10; }
#loading .box { text-align: center; display: grid; gap: 8px; }
#loading .t { font-weight: 800; font-size: 28px; letter-spacing: 0.04em; }
#loading .s { color: #cfdae6; font-weight: 500; font-size: 14px; }

@media (max-width: 1000px) {
  #percent { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  #requests { right: calc(12px + env(safe-area-inset-right, 0px)); top: calc(220px + env(safe-area-inset-top, 0px)); }
}
@media (max-width: 640px) {
  #card { width: 210px; }
  #tools { bottom: calc(132px + env(safe-area-inset-bottom, 0px)); flex-wrap: wrap; width: 126px; }
  #tray, #wtray { width: min(304px, calc(100vw - 24px)); bottom: calc(176px + env(safe-area-inset-bottom, 0px)); }
  #ranking { width: 170px; }
}
@media (max-height: 460px) { #ranking { display: none; } }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<script>
"use strict";
const WORKER_SRC = /*__WORKER__*/"";
const MAPDATA = /*__MAP__*/null;

// ---------------------------------------------------------------- map geometry
const W = MAPDATA.W, H = MAPDATA.H, N = W * H;
const B62 = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
const b62 = {}; for (let i = 0; i < 62; i++) b62[B62[i]] = i;

for (let y = 0; y < H; y++) {
  const row = MAPDATA.rows[y]; let x = 0;

    const id = b62[row[k]] * 62 + b62[row[k + 1]], len = b62[row[k + 2]] * 62 + b62[row[k + 3]];

{ const yTop = 1.25 * Math.log(Math.tan(Math.PI / 4 + 0.4 * 84 * Math.PI / 180)), span = 2 * Math.PI * H / W;

// ---------------------------------------------------------------- client state (mirror of the server)

  missiles: {}, match: { phase: "waiting", round: 0, left: 0 }, matchAt: 0, you: null, me: null, percent: 0.25,
  config: null, palette: null, cpu: 0,

const relKey = (a, b) => a < b ? a + ":" + b : b + ":" + a;
const relation = (a, b) => (a == null || b == null) ? "neutral" : a === b ? "self" : (S.relations[relKey(a, b)] || "neutral");
const rgb = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;
const shade = (c, f) => c.map((v) => Math.max(0, Math.min(255, Math.floor(v * f))));
const mix = (a, b, t) => a.map((v, k) => Math.floor(v + (b[k] - v) * t + 0.5));

// ---------------------------------------------------------------- territory image (one pixel per cell)
const mapCanvas = document.createElement("canvas"); mapCanvas.width = W; mapCanvas.height = H;
const mapCtx = mapCanvas.getContext("2d");
const img = mapCtx.createImageData(W, H);
let colors = {}, rowNeutral = [], dirty = new Set(), fullDirty = true;
function recolor() {
  colors = {};
  for (const id in S.nations) { const base = nationColor(+id); colors[id] = { fill: base, border: shade(base, 0.58), line: shade(base, 0.9) }; }
  for (let y = 0; y < H; y++) rowNeutral[y] = mix(S.palette.Neutral, S.palette.NeutralPolar, Math.max(0, Math.min(1, (Math.abs(latitude[y]) - 56) / 24)));
}
function cellColor(i) {
  const o = S.owner[i], x = (i - 1) % W, P = S.palette;
  if (o === -1) return landNear[i] ? P.WaterCoast : P.Water;
  const c = country[i]; let otherOwner = false, otherCountry = false;
  const check = (j) => { const oj = S.owner[j]; if (oj !== -1) { if (oj !== o) otherOwner = true; if (country[j] !== c) otherCountry = true; } };
  if (x > 0) check(i - 1); if (x < W - 1) check(i + 1); if (i > W) check(i - W); if (i <= N - W) check(i + W);
  if (o === 0) return otherCountry ? P.CountryLine : rowNeutral[Math.floor((i - 1) / W)];
  const nc = colors[o]; if (!nc) return rowNeutral[Math.floor((i - 1) / W)];
  return otherOwner ? nc.border : otherCountry ? nc.line : nc.fill;
}
function paintCell(i) { const c = cellColor(i), o = (i - 1) * 4; img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255; }
function markAround(i) { dirty.add(i); const x = (i - 1) % W; if (x > 0) dirty.add(i - 1); if (x < W - 1) dirty.add(i + 1); if (i > W) dirty.add(i - W); if (i <= N - W) dirty.add(i + W); }

  if (fullDirty) { for (let i = 1; i <= N; i++) paintCell(i); fullDirty = false; dirty.clear(); mapCtx.putImageData(img, 0, 0); }
  else if (dirty.size) { for (const i of dirty) paintCell(i); dirty.clear(); mapCtx.putImageData(img, 0, 0); }
}

// ---------------------------------------------------------------- camera
const canvas = document.getElementById("map"), g = canvas.getContext("2d");
const cam = { scale: 1, cx: W / 2, cy: H / 2 };
let vw = innerWidth, vh = innerHeight, dpr = 1;
const minScale = () => Math.min(vw / W, vh / H);
const maxScale = () => Math.max(minScale() * 2, 28);

const toMap = (sx, sy) => [cam.cx + (sx - vw / 2) / cam.scale, cam.cy + (sy - vh / 2) / cam.scale];
function screenToCell(sx, sy) { const [x, y] = toMap(sx, sy); const cx = Math.floor(x), cy = Math.floor(y); return (cx < 0 || cy < 0 || cx >= W || cy >= H) ? null : cy * W + cx + 1; }
function zoomAt(sx, sy, f) {
  const [mx, my] = toMap(sx, sy); const before = cam.scale;
  cam.scale = Math.max(minScale(), Math.min(maxScale(), cam.scale * f));
  if (cam.scale === before) return;
  cam.cx = mx - (sx - vw / 2) / cam.scale; cam.cy = my - (sy - vh / 2) / cam.scale; clampCam();
}
function pan(dx, dy) { cam.cx -= dx / cam.scale; cam.cy -= dy / cam.scale; clampCam(); }
const lod = () => { const z = cam.scale / minScale(); return z >= 4 ? 2 : z >= 1.6 ? 1 : 0; };
const center = (i) => { const [x, y] = xy(i); return [x + 0.5, y + 0.5]; };

// ---------------------------------------------------------------- drawing
let aim = null; const flashes = [];
function label(text, x, y, size, color, stroke, align) {
  g.font = `700 ${size}px Montserrat, system-ui, sans-serif`; g.textAlign = align || "center"; g.textBaseline = "middle";
  g.lineJoin = "round"; g.lineWidth = Math.max(2, size / 4); g.strokeStyle = stroke; g.strokeText(text, x, y); g.fillStyle = color; g.fillText(text, x, y);
}
function pill(text, x, y, size, bg, fg) {
  g.font = `700 ${size}px Montserrat, system-ui, sans-serif`; const w = g.measureText(text).width + 12, h = size + 8;
  g.fillStyle = bg; g.beginPath(); g.roundRect(x - w / 2, y - h, w, h, 4); g.fill();
  g.fillStyle = fg; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(text, x, y - h / 2 + 0.5);
}
let t0frame = 0;
function draw(now) {
  if (!S.palette) return;
  t0frame = performance.now();
  flushImage();
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = rgb(S.palette ? S.palette.Water : [46, 92, 138]); g.fillRect(0, 0, vw, vh);

  for (const r of ranges()) {

    g.fillStyle = r.color + "22"; g.strokeStyle = r.color; g.lineWidth = 1.5;
    g.beginPath(); g.arc(cx, cy, r.radius * s, 0, Math.PI * 2); g.fill(); g.stroke();

  if (level >= 1) {
    const size = Math.max(12, Math.min(26, s * 1.7));

      const [mx, my] = center(cell), [sx, sy] = toScreen(mx, my); if (!onScreen(sx, sy, size)) continue;

      g.strokeStyle = "rgba(255,255,255,0.8)"; g.lineWidth = 1; g.stroke();
      g.font = `${Math.floor(size * 0.66)}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
      g.fillStyle = "#fff"; g.globalAlpha = b.off ? 0.5 : 1; g.fillText(S.config.Buildings[b.kind].icon, sx, sy + 1); g.globalAlpha = 1;

    const [bx, by] = boatPos(b, t0frame), [sx, sy] = toScreen(bx, by), size = Math.max(14, Math.min(26, s * 1.8));
    if (!onScreen(sx, sy, size)) continue;
    if (mine && b.patrol) {
      const [px, py] = toScreen(...center(b.patrol)); g.strokeStyle = rgb(nationColor(b.nation)); g.globalAlpha = 0.5; g.lineWidth = 1;
      g.beginPath(); g.arc(px, py, (S.config.Naval.BoatOrbit + 1) * s, 0, Math.PI * 2); g.stroke(); g.globalAlpha = 1;
    }
    if (selectedBoat === b.id) { g.strokeStyle = "#f0c45c"; g.lineWidth = 2; g.beginPath(); g.arc(sx, sy, size * 0.75, 0, Math.PI * 2); g.stroke(); }
    g.font = `${size}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = "#fff"; g.fillText("🚢", sx, sy);
    g.fillStyle = "#141a22"; g.fillRect(sx - size / 2, sy + size * 0.55, size, 4);
    g.fillStyle = rgb(nationColor(b.nation)); g.fillRect(sx - size / 2, sy + size * 0.55, size * Math.max(0, Math.min(1, b.hp / S.config.Naval.BoatHealth)), 4);

    case "diplomacy":
      if (e.rel) { if (e.rel === "neutral") delete S.relations[relKey(e.a, e.b)]; else S.relations[relKey(e.a, e.b)] = e.rel; }
      if (e.request != null) allianceRequest(e.request, e.expires); break;
    case "match": onMatch({ phase: e.phase, round: e.round, left: e.left, winner: e.winner, mode: e.mode, votes: e.votes }); break;
    case "impact":
      if (e.launch) { const m = e.launch; S.missiles[m[0]] = { kind: m[1], nation: m[2], from: m[3], to: m[4], speed: m[5], progress: 0, t0: now }; }
      if (e.hit) { delete S.missiles[e.hit[0]]; flashes.push({ cell: e.hit[2], stopped: e.hit[3], t0: now, r: (S.config.Weapons[e.hit[1]] || { radius: 3 }).radius }); }
      break;
    case "orders":
      if (e.fleet) { const f = e.fleet; S.fleets[f[0]] = { nation: f[1], troops: f[2], path: f[3], speed: f[4], progress: 1, air: !!f[6], t0: now }; }
      if (e.fleetEnd != null) delete S.fleets[e.fleetEnd];
      break;
  }
}
// boats glide between the 0.4 s updates: keep previous and next positions
function setBoats(rows) {
  const now = performance.now(), next = {};
  for (const r of rows) {
    const old = S.boats[r[0]];
    const [px, py] = old ? boatPos(old, now) : [r[2], r[3]];
    next[r[0]] = { id: r[0], nation: r[1], fx: px, fy: py, x: r[2], y: r[3], hp: r[4], patrol: r[5], level: r[6], t0: now };
  }
  S.boats = next;
}
function boatPos(b, now) { const t = Math.min(1, (now - b.t0) / 400); return [b.fx + (b.x - b.fx) * t, b.fy + (b.y - b.fy) * t]; }
function allianceRequest(from, seconds) {
  const n = S.nations[from]; if (!n) return;
  const card = document.createElement("div"); card.className = "req panel";
  card.innerHTML = `<div>🤝 ${n.name.replace(/</g, "&lt;")} propõe aliança</div><div class="btns"><button class="yes">Aceitar</button><button>Recusar</button></div>`;
  card.querySelector(".yes").onclick = () => { card.remove(); send("ally", from); };
  card.querySelectorAll("button")[1].onclick = () => { card.remove(); send("decline", from); };
  $("requests").appendChild(card); setTimeout(() => card.remove(), (seconds || 30) * 1000);
}
function applyFrame(d) {
  for (const e of d.events || []) applyEvent(e);
  if (d.init) applyInit(d.init);
  if (d.delta) {
    const cells = d.delta.d; if (cells) for (let k = 0; k < cells.length; k += 2) { S.owner[cells[k]] = cells[k + 1]; markAround(cells[k]); }
    if (d.delta.b) for (const b of d.delta.b) { if (b[1]) S.buildings.set(b[0], { kind: b[1], owner: b[2], level: b[3] || 1, off: !!b[4] }); else S.buildings.delete(b[0]); }
  }
  if (d.nations) {
    for (const r of d.nations.list) { const n = S.nations[r[0]]; if (n) { n.troops = r[1]; n.land = r[2]; n.labelCell = r[3]; n.labelSize = r[4]; n.capital = r[5]; } }
    onMatch(d.nations.match); refreshRanking();
  }
  if (d.orders) {
    S.orders = d.orders.orders || []; setBoats(d.orders.boats || []); S.fires = d.orders.fires || []; S.cargos = d.orders.cargos || [];
    const now = performance.now(); for (const r of d.orders.fleets || []) { const f = S.fleets[r[0]]; if (f) { f.troops = r[2]; f.progress = r[3]; f.t0 = now; } }
  }
  if (d.me) { S.me = d.me; if (S.you !== d.me.id) { S.you = d.me.id; } refreshMe(); }
  S.cpu = d.cpu || 0;
}
let booted = false;
worker.onmessage = (e) => {
  const m = e.data;
  if (m.t === "error") { console.error(m.error); toast("Erro na simulação: " + m.error.slice(0, 120), "bad"); return; }
  const d = JSON.parse(m.data);
  if (m.t === "boot") {
    S.palette = d.palette; S.config = d.config; buildHud(); applyInit(d.init); booted = true;
    if (m.engine === "js") setTimeout(() => toast("Este navegador bloqueou o motor rápido (WebAssembly); a simulação pode ficar lenta.", "bad"), 500);
    $("loading").hidden = true; resize(); fit(); buildMenu();
  } else if (m.t === "frame") applyFrame(d);
  else if (m.t === "reply") { if (d.msg) toast(d.msg, d.ok ? "good" : "bad"); }
};
worker.onerror = (e) => { $("loadingText").textContent = "Não foi possível iniciar a simulação: " + (e.message || "erro"); };
worker.postMessage({ t: "start" });

// ---------------------------------------------------------------- clicks: spawn, two-click orders, modes
function nearestBorder(nid, cell) {
  const [cx, cy] = xy(cell); let best = null, bd = Infinity;
  for (let i = 1; i <= N; i++) if (S.owner[i] === nid) { const x = (i - 1) % W, y = (i - 1 - x) / W, d = (x - cx) ** 2 + (y - cy) ** 2; if (d < bd) { bd = d; best = i; } }
  return best;
}
const troopsToSend = () => S.me ? Math.floor(S.me.troops * S.percent) : 0;
function aimOrder(cell) {
  const o = S.owner[cell], rel = o > 0 ? relation(S.you, o) : "neutral";
  let text, color = "#ffffff";
  if (rel === "ally") { text = "Aliado: cancele a aliança para atacar"; color = "#78c8ff"; }
  else if (o === 0) text = "Clique de novo: expandir com " + fmtK(troopsToSend());
  else { text = "Clique de novo: atacar " + S.nations[o].name + " com " + fmtK(troopsToSend()); color = "#ff8c6e"; }
  aim = { kind: "order", cell, at: performance.now(), from: nearestBorder(S.you, cell), text, color };
}
function nationPopover(sx, sy, id) {
  const n = S.nations[id]; if (!n || id === S.you) return;
  const rel = relation(S.you, id), relText = { ally: "🤝 Aliado", war: "⚔ Em guerra", neutral: "Neutro" }[rel] || rel;
  const buttons = [];
  if (S.you) {
    if (rel === "ally") buttons.push(["Cancelar aliança", () => send("breakAlliance", id), true]);
    else { buttons.push(["🤝 Aliança", () => send("ally", id)]); if (rel !== "war") buttons.push(["⚔ Guerra", () => send("war", id), true]); }
  }
  showPopover(sx, sy, n.name, `👥 ${fmtK(n.troops)} · ${(n.land / LANDCOUNT * 100).toFixed(1)}% do mundo\n${relText}`, buttons);
}
function handleClick(sx, sy, button) {
  hidePopover(); if (!booted) return;
  if (!mode) selectedCell = null;
  const cell = screenToCell(sx, sy); if (!cell) return;
  const owner = S.owner[cell], phase = S.match.phase, V = S.config.View;
  if (button === 2) { if (owner > 0) nationPopover(sx, sy, owner); return; }
  if (!S.you) {
    if (phase === "spawn" || phase === "playing") { if (owner === -1) toast("Escolha uma célula de terra.", "bad"); else send("spawn", cell); }
    else toast("Aguardando a próxima rodada.");
    return;
  }
  if (mode === "build") { if (buildKind) send("build", cell, buildKind); else toast("Escolha uma construção na lista."); return; }
  if (mode === "patrol") {
    if (land(cell)) { toast("Escolha um ponto na água para o barco patrulhar.", "bad"); return; }
    send("patrol", selectedBoat, cell); setMode(null); return;
  }
  if (mode === "weapon") {
    if (!buildKind) { toast("Escolha uma arma na lista."); return; }
    const w = S.config.Weapons[buildKind], now = performance.now();
    if (aim && aim.kind === "weapon" && dist(aim.cell, cell) <= V.ConfirmRadius && now - aim.at <= V.ConfirmTimeout * 1000) { send("weapon", aim.cell, buildKind, S.percent); setMode(null); return; }
    aim = { kind: "weapon", cell, at: now, text: `Clique de novo para lançar ${w.icon} ${w.name} · 💰 ${fmtK(w.gold)}`, color: "#ff5a50" };
    return;
  }
  // clicking one of our boats selects it; the next click on the water sets its patrol
  { const [mx, my] = toMap(sx, sy); let best = null, bd = Math.max(1.5, 12 / cam.scale) ** 2;
    for (const id in S.boats) { const b = S.boats[id]; if (b.nation !== S.you) continue; const [bx, by] = boatPos(b, performance.now()); const d = (bx - mx) ** 2 + (by - my) ** 2; if (d <= bd) { bd = d; best = b; } }
    if (best) { setMode("patrol"); selectedBoat = best.id; toast("Barco selecionado: clique na água onde ele deve patrulhar."); return; } }
  if (owner === S.you) {
    aim = null; const b = S.buildings.get(cell);
    if (b) {
      const def = S.config.Buildings[b.kind], info = S.config.BuildingInfo[b.kind];
      let body = (b.off ? "⚡ Desligada por EMP.\n" : "") + def.purpose + "\n" + info.lines[b.level - 1];
      const buttons = [], cost = info.upgrade[b.level - 1];
      if (cost > 0) { body += `\nNível ${b.level + 1}: ${info.lines[b.level]}`; buttons.push([`⬆ Melhorar · 💰 ${fmtK(cost)}`, () => send("upgrade", cell)]); }
      if (b.kind === "port") buttons.push([`🚢 Barco · 💰 ${fmtK(S.config.Naval.BoatGold)}`, () => send("warship", cell)]);
      showPopover(sx, sy, `${def.icon} ${def.name} · Nível ${b.level}`, body, buttons);
      selectedCell = cell;
    }
    return;
  }
  if (owner === -1) { aim = null; toast("Água não pode ser conquistada. Clique numa costa para invadir com um porto."); return; }
  const now = performance.now();
  if (!V.TwoClickConfirm || (aim && aim.kind === "order" && dist(aim.cell, cell) <= V.ConfirmRadius && now - aim.at <= V.ConfirmTimeout * 1000)) {
    const target = aim ? aim.cell : cell; aim = null; send("target", target, S.percent); return;
  }
  aimOrder(cell);
  if (owner > 0) nationPopover(sx, sy, owner);
}

// ---------------------------------------------------------------- input: drag, wheel, pinch, keys
const pointers = new Map(); let press = null, pinch = null;
canvas.addEventListener("contextmenu", (e) => e.preventDefault());
canvas.addEventListener("pointerdown", (e) => {
  canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) press = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, moved: false, button: e.button === 2 ? 2 : 1 };
  else if (pointers.size === 2) { press = null; const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; }
});
canvas.addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") hoverCell = screenToCell(e.clientX, e.clientY);
  if (!pointers.has(e.pointerId)) return; pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size >= 2) {
    const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    if (pinch.d > 0) zoomAt(mx, my, d / pinch.d); pan(mx - pinch.mx, my - pinch.my); pinch = { d, mx, my };
  } else if (press) {
    const thr = (e.pointerType === "touch" ? 2 : 1) * (S.config ? S.config.View.DragThreshold : 6);
    if (!press.moved && Math.hypot(e.clientX - press.x, e.clientY - press.y) > thr) press.moved = true;
    if (press.moved) { pan(e.clientX - press.lx, e.clientY - press.ly); }
    press.lx = e.clientX; press.ly = e.clientY;
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null;
  if (press && !press.moved && e.type === "pointerup") handleClick(e.clientX, e.clientY, press.button);
  if (pointers.size === 0) press = null;
}
canvas.addEventListener("pointerup", endPointer); canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("wheel", (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.15 : 1 / 1.15); }, { passive: false });
const keys = new Set();
addEventListener("keydown", (e) => {
  if (!booted) return; keys.add(e.code);
  if (e.code === "Escape") { setMode(null); hidePopover(); if (S.match.phase !== "ended") $("center").hidden = true; }
  else if (e.code === "KeyF" || e.code === "Home") fit();
  else if (e.code === "KeyB") setMode(mode === "build" ? null : "build");
  else if (e.code === "Space" && S.you && S.nations[S.you]) { e.preventDefault(); const [x, y] = center(S.nations[S.you].capital); cam.cx = x; cam.cy = y; cam.scale = Math.max(cam.scale, minScale() * 3); clampCam(); }
  else if (/^Digit[1-5]$/.test(e.code)) setPercent(S.config.TroopPercents[+e.code.slice(5) - 1]);
});
addEventListener("keyup", (e) => keys.delete(e.code));
addEventListener("blur", () => keys.clear());
addEventListener("resize", resize);

// ---------------------------------------------------------------- loop
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  try { step(now); } catch (err) { console.error(err); }
}
function step(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  let dx = 0, dy = 0;
  if (keys.has("KeyA") || keys.has("ArrowLeft")) dx += 1; if (keys.has("KeyD") || keys.has("ArrowRight")) dx -= 1;
  if (keys.has("KeyW") || keys.has("ArrowUp")) dy += 1; if (keys.has("KeyS") || keys.has("ArrowDown")) dy -= 1;
  if (dx || dy) pan(dx * 900 * dt, dy * 900 * dt);
  if (keys.has("Equal") || keys.has("NumpadAdd")) zoomAt(vw / 2, vh / 2, 1 + 2 * dt);
  if (keys.has("Minus") || keys.has("NumpadSubtract")) zoomAt(vw / 2, vh / 2, 1 - 1.5 * dt);
  if (booted) {
    if (aim && performance.now() - aim.at > S.config.View.ConfirmTimeout * 1000) aim = null;
    let text = "";
    if (mode === "build") text = buildKind ? `🏗 ${S.config.Buildings[buildKind].name}: clique numa célula sua · Esc sai` : "🏗 Escolha uma construção";
    else if (mode === "weapon") text = buildKind ? `${S.config.Weapons[buildKind].icon} Escolha o alvo · Esc cancela` : "💣 Escolha uma arma";
    else if (mode === "patrol") text = "🚢 Clique na água onde o barco deve patrulhar · Esc cancela";
    else if (S.match.phase === "spawn") text = S.you ? `A guerra começa em ${Math.ceil(timeLeft())}s · ⏭ começa já`
      : S.match.mode === "extreme" ? `🔥 Clique num país para governá-lo · ${Math.ceil(timeLeft())}s` : `Clique numa terra livre para fundar sua nação · ${Math.ceil(timeLeft())}s`;
    else if (S.match.phase === "playing" && !S.you) text = S.match.mode === "extreme" ? "🔥 Clique num país controlado pela IA para governá-lo" : "Clique numa terra livre para fundar uma nova nação";
    else if (S.match.phase === "vote") text = "";
    $("banner").hidden = !text; $("banner").textContent = text;
    tools.skip.hidden = S.match.phase !== "spawn";
    refreshMenu();
  }
  draw(now);
}
resize();
requestAnimationFrame(loop);
</script>
